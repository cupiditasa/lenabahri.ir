server {
    listen 80;
    listen [::]:80;
    server_name lenabahri.ir www.lenabahri.ir;

    server_tokens off;
    return 301 https://lenabahri.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lenabahri.ir;

    ssl_certificate /etc/letsencrypt/live/lenabahri.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenabahri.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:lenabahri_tls:10m;
    ssl_session_tickets off;
    server_tokens off;

    return 301 https://lenabahri.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lenabahri.ir;

    root /var/www/lenabahri/current;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/lenabahri.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenabahri.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:lenabahri_tls:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /about-me {
        return 301 https://lenabahri.ir/about.html;
    }

    location = /about-me/ {
        return 301 https://lenabahri.ir/about.html;
    }

    location = /contact-me {
        return 301 "https://lenabahri.ir/#contact";
    }

    location = /contact-me/ {
        return 301 "https://lenabahri.ir/#contact";
    }

    rewrite ^/portfolio/?$ https://lenabahri.ir/portfolio.html permanent;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/api/public/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location ~ ^/(?<cms_locale>en|ar|zh)/khabar/beauty/(?<cms_slug>[a-z0-9-]+)/?$ {
        set $cms_render_locale $cms_locale;
        set $cms_render_slug $cms_slug;
        try_files $uri $uri/ @render_cms_news;
    }

    location ~ ^/khabar/beauty/(?<cms_root_slug>[a-z0-9-]+)/?$ {
        set $cms_render_locale fa;
        set $cms_render_slug $cms_root_slug;
        try_files $uri $uri/ @render_cms_news;
    }

    location @render_cms_news {
        rewrite ^ /api/public/render-news?slug=$cms_render_slug&locale=$cms_render_locale last;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
