<!doctype html>
<html lang="zh-Hans" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Lena Bahri 客户安全登录、完善个人资料并查看预约申请状态。">
  <title>客户登录与订单状态 | Lena Bahri</title>
  <link rel="icon" href="/assets/brand/logo-lb-optimized.png"><link rel="stylesheet" href="/style.css?v=20261012-1"><link rel="stylesheet" href="/assets/site-locale.css"><link rel="stylesheet" href="/assets/customer-account.css?v=20261014-1">
</head>
<body class="customer-account-page">
  <header class="site-header" id="top"><a class="brand" href="/zh/" aria-label="Lena Bahri 首页"><span class="brand-mark brand-logo"><img src="/assets/brand/logo-lb-optimized.png" alt=""></span><span class="brand-copy"><b>LENA BAHRI</b><small>PMU MASTER ARTIST</small></span></a><nav class="main-nav" aria-label="主导航"><a href="/zh/">首页</a><a href="/zh/services.html">服务与价格</a><a href="/zh/portfolio.html">作品集</a><a href="/zh/account.html" data-customer-account-link>用户登录</a></nav><a class="header-cta" href="/zh/#booking">提交申请 <span>→</span></a></header>
  <main class="account-layout">
    <section class="account-intro"><p class="account-kicker">个人资料与订单跟踪</p><h1>客户账户</h1><p>使用预约时填写的手机号登录，完善资料并查看申请状态。</p></section>
    <section class="account-panel" aria-live="polite">
      <div id="loginView"><form id="phoneForm" class="account-form"><label for="customerPhone">手机号码</label><input id="customerPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例如 0917 123 4567" required><button class="account-button" type="submit">发送一次性验证码</button></form>
        <form id="otpForm" class="account-form" hidden><label for="customerOtp">6 位短信验证码</label><input id="customerOtp" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9۰-۹٠-٩]{6}" maxlength="6" required><button class="account-button" type="submit">验证并登录</button><button class="account-text-button" id="resendOtp" type="button" disabled>重新发送验证码</button><button class="account-text-button" id="changePhone" type="button">更换号码</button></form>
      </div>
      <div id="customerView" hidden><div class="account-topline"><p id="phoneHint"></p><button class="account-text-button" id="logoutButton" type="button">退出登录</button></div>
        <section class="profile-section" aria-labelledby="profileHeading"><div class="profile-heading"><div><p class="account-kicker">我的账户</p><h2 id="profileHeading">个人资料</h2></div><div class="profile-avatar" id="profileAvatar"><img id="profilePhoto" alt="头像" hidden></div></div>
          <form id="profileForm" class="account-form" enctype="multipart/form-data"><label for="customerName">姓名</label><input id="customerName" name="full_name" type="text" autocomplete="name" maxlength="120" required><label for="customerPhoto">头像（可选）</label><input id="customerPhoto" name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG、PNG 或 WebP，最大 1.5 MB。照片为私密资料，仅登录账户后可查看。</small><label class="account-consent"><input type="checkbox" name="consent" required><span>我同意保存姓名和可选头像。活跃数据库中的信息将在 90 天后删除；私密备份可能额外保留最多 7 天。</span></label><button class="account-button" type="submit">保存资料</button></form>
        </section>
        <section class="orders-section" aria-labelledby="ordersHeading"><div class="profile-heading"><div><p class="account-kicker">已提交申请</p><h2 id="ordersHeading">订单状态</h2></div></div><div id="ordersList" class="orders-list"></div></section><a class="account-new-request" href="/zh/#booking">提交新申请 <span>→</span></a>
      </div>
      <p class="account-feedback" id="accountFeedback" role="status" aria-live="polite"></p>
    </section>
    <p class="account-footnote">登录使用短信一次性验证码。工作室审核并更新申请后，您可以查看状态。</p>
  </main>
  <script src="/assets/site-locale.js?v=20261014-1" defer></script><script src="/assets/customer-account.js?v=20261014-1" defer></script>
</body>
</html>
