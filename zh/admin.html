<!doctype html>
<html lang="zh-Hans" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <title>预约申请管理 | Lena Bahri</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="admin.js" defer></script>
<link rel="canonical" href="https://lenabahri.ir/zh/admin.html">
  <link rel="alternate" hreflang="en" href="https://lenabahri.ir/en/admin.html">
  <link rel="alternate" hreflang="ar" href="https://lenabahri.ir/ar/admin.html">
  <link rel="alternate" hreflang="zh-CN" href="https://lenabahri.ir/zh/admin.html">
  <link rel="alternate" hreflang="fa" href="https://lenabahri.ir/admin.html">
  <link rel="alternate" hreflang="x-default" href="https://lenabahri.ir/admin.html">
  <link rel="stylesheet" href="/assets/site-locale.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <a class="admin-brand" href="/zh/"><span class="brand-mark">LB</span><span><b>LENA BAHRI</b><small>预约申请管理</small></span></a>
      <a class="back-link" href="/zh/">返回网站 <span>←</span></a>
    </header>

    <section class="login-panel" id="loginPanel" aria-labelledby="loginTitle">
      <p class="eyebrow">管理员安全登录</p>
      <h1 id="loginTitle">预约管理面板</h1>
      <p class="muted">请登录管理员账户以查看申请。</p>
      <form id="loginForm" autocomplete="on">
        <label>用户名<input name="username" type="text" autocomplete="username" value="lena" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">登录管理面板</button>
      </form>
      <p class="feedback" id="loginFeedback" role="status" aria-live="polite"></p>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <div class="dashboard-title">
        <div><p class="eyebrow">工作室管理</p><h1>预约申请</h1><p class="muted">提交的资料和照片仅管理员可查看。</p></div>
        <button class="quiet-button" id="logoutButton" type="button">安全退出</button>
      </div>
      <div class="summary" id="summary" aria-label="申请概览"></div>
      <div class="toolbar">
        <label class="search-label"><span class="sr-only">搜索</span><input id="searchInput" type="search" placeholder="按姓名、电话或申请编号搜索"></label>
        <label class="filter-label"><span class="sr-only">按状态筛选</span><select id="statusFilter"><option value="">所有状态</option><option value="pending">待处理</option><option value="contacted">已联系</option><option value="confirmed">已确认</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></label>
        <button class="quiet-button" id="refreshButton" type="button">刷新</button>
      </div>
      <p class="feedback" id="dashboardFeedback" role="status" aria-live="polite"></p>
      <div class="booking-list" id="bookingList"></div>
    </section>
    <footer>Lena Bahri 私人预约系统 · 活跃数据库将在 90 天后清理；技术恢复备份可能额外保留最多 7 天。</footer>
  </main>
<script src="/assets/site-locale.js" defer></script>
</body>
</html>
